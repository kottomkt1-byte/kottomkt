<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>고또마케팅 — 안경 산업 콘텐츠</title>
  <style>
    @font-face {
      font-family: "Kotto Display";
      src: url("../public/fonts/KottoDisplay.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }
    @font-face {
      font-family: "Kotto Text";
      src: url("../public/fonts/KottoText.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; }
    body { background: #111315; color: #fff; font-family: "Kotto Text", sans-serif; }
    .card { width: 1200px; height: 630px; overflow: hidden; }
    .masthead {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 42px;
      align-items: end;
      height: 304px;
      padding: 42px 48px 39px;
    }
    .name { margin: 0 0 24px 4px; font-size: 14px; font-weight: 450; letter-spacing: -.02em; }
    .wordmark {
      margin: 0 0 0 -5px;
      font-size: 212px;
      font-weight: 700;
      line-height: .8;
      letter-spacing: -.078em;
      white-space: nowrap;
    }
    .copy { border-left: 1px solid #ffffff38; padding-left: 27px; }
    .category {
      margin: 0 0 22px;
      font-size: 12px;
      font-weight: 450;
      line-height: 1.7;
      color: #b8bfbd;
      letter-spacing: -.02em;
    }
    h1 { margin: 0; font-size: 29px; font-weight: 550; line-height: 1.55; letter-spacing: -.045em; }
    h1 span { display: block; white-space: nowrap; }
    .audience { margin: 21px 0 0; font-size: 11px; line-height: 1.6; letter-spacing: -.02em; color: #b8bfbd; }
    .film-strip { display: grid; grid-template-columns: repeat(3, 1fr); height: 326px; }
    .portrait { margin: 0; min-width: 0; overflow: hidden; }
    .portrait img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .portrait-warm img { object-position: 50% 12%; }
    .portrait-light img { object-position: 50% 8%; }
    .portrait-deep img { object-position: 50% 16%; }
  </style>
  <script>
    // Preserve the shared renderer's font-readiness contract.
    document.fonts.load('450 45px "Kotto Display"');
  </script>
</head>
<body>
  <main class="card" aria-label="고또마케팅 안경 산업 광고·콘텐츠 마케팅">
    <section class="masthead">
      <div class="brand">
        <p class="name">고또마케팅</p>
        <p class="wordmark">KOTTO</p>
      </div>
      <div class="copy">
        <p class="category">안경 산업 전문<br>광고·콘텐츠 마케팅</p>
        <h1><span>안경을 아는 시선.</span><span>브랜드를 위한 콘텐츠.</span></h1>
        <p class="audience">안경원 · 아이웨어 · 렌즈 · 제조·유통</p>
      </div>
    </section>
    <section class="film-strip" aria-label="고또마케팅 실제 포트폴리오">
      <figure class="portrait portrait-warm">
        <img src="../public/portfolio/model-images/tf1289-01a-women-03.webp"
             width="1122" height="1402"
             alt="테라코타 벽 앞에서 선글라스와 아이보리 재킷을 착용한 여성 모델">
      </figure>
      <figure class="portrait portrait-light">
        <img src="../public/portfolio/model-images/tf5922-020-men-03.webp"
             width="1122" height="1402"
             alt="민트색 배경에서 투명한 회색 안경과 아이보리 셔츠를 착용한 남성 모델">
      </figure>
      <figure class="portrait portrait-deep">
        <img src="../public/portfolio/model-images/tf1381-01a-men-03.webp"
             width="1122" height="1402"
             alt="딥 블루 배경에서 선글라스와 버건디 재킷을 착용한 남성 모델">
      </figure>
    </section>
  </main>
</body>
</html>
